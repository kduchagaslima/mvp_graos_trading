services:
  # 1. Banco de Dados Relacional (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: agri_trading_db
    environment:
      POSTGRES_DB: agri_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agri_trading"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trading_net

  # 2. Dashboard Interativo do Trader (Streamlit)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_trading_dashboard
    command: streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/agri_trading
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - trading_net
      - nginx-proxy_default

  # 3. API Backend REST & Cálculo (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_trading_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/agri_trading
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - trading_net
      - nginx-proxy_default

volumes:
  postgres_data:
    driver: local

networks:
  trading_net:
    driver: bridge
  nginx-proxy_default:
    external: true
